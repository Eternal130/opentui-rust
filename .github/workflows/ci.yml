name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: nextest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run test suite
        run: cargo nextest run --workspace --locked --no-fail-fast

  differential:
    name: differential vs @opentui 0.5.14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # The acceptance instrument: every tracked scenario must render
      # cell-grid-identical to the real @opentui 0.5.14 (bun oracle).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install oracle deps
        run: bun install --frozen-lockfile
        working-directory: tools/diff/sandbox

      - name: Run scenarios
        run: |
          for s in tools/diff/scenarios/*.json; do
            cargo run -q --locked -p opentui-diff -- "$s"
          done
