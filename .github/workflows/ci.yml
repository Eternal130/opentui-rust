name: ci

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  lint:
    name: fmt + clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - name: rustfmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  test:
    name: nextest
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest

      - name: Run test suite
        run: cargo nextest run --workspace --locked --no-fail-fast

  differential:
    name: differential vs @opentui 0.5.14
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # The acceptance instrument: every tracked scenario must render
      # cell-grid-identical to the real @opentui 0.5.14 (bun oracle).
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.10

      - name: Install oracle deps
        run: |
          # a node_modules symlink must never survive checkout (a
          # committed self-referencing one once broke this job: bun
          # resolved through the loop and the driver lost @opentui/core)
          find . -maxdepth 1 -name node_modules -type l -delete
          bun install --frozen-lockfile
          # solid oracle: patch solid-js's node condition (SSR stub trap)
          # + link the driver-resolution node_modules (js/ is outside
          # sandbox/, bun would otherwise resolve from the global cache)
          bash ../js/ensure-solid-client-build.sh
        working-directory: tools/diff/sandbox

      - name: Run scenarios
        run: |
          for s in tools/diff/scenarios/*.json; do
            cargo run -q --locked -p opentui-diff -- "$s"
          done

  # Perf lane: "no catastrophic regression" ceilings on the frame paths.
  # Deliberately SEPARATE from the differential job (byte-identical
  # output is proven there; this job only guards the frame budgets).
  # Shared runners are noisy and 2-5x slower than a dev box, so the
  # ceilings are ~10x the dev-box medians — a real budget regression
  # (e.g. a per-frame Vec clone sneaking back into the paint walk)
  # still trips them, scheduler jitter does not. Local truth:
  #   cargo run --release -p opentui-bench            # full table
  #   tools/bench/oracle/run-oracle.sh                # REAL 0.5.14 numbers
  perf:
    name: frame budgets (ceilings)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: Swatinem/rust-cache@v2

      # quick tier: fewer iterations, same ceilings — medians only
      - name: Run perf rig
        run: cargo run --release --locked -p opentui-bench -- --quick --check
