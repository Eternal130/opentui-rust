[package]
name = "opentui-core"
description = "API-level Rust port of @opentui/core 0.5.14 (renderables, raster semantics, layout, colors, renderer)"
version.workspace = true
edition.workspace = true
license.workspace = true

[build-dependencies]
cc = "1"

[dependencies]
taffy = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tree-sitter = "0.25.10"
tree-sitter-language = "0.1.9"
# the MP3 decoder — the same one upstream's miniaudio uses (dr_mp3
# builds directly on minimp3), for loadSound's real decode path
minimp3 = "0.5"
# the VT state machine for the embedded terminal engine (already in the
# lockfile as the vt100 replay dependency — no new transitive deps)
vte = "0.11"
# the terminal-backend lane (Phase A1): termios raw/restore + /dev/tty
# open + TIOCGWINSZ — the layer upstream delegates to the Node host
# (terminal.zig / renderer.zig vendored under third_party/opentui).
# Safe rust, no non-Rust transitive deps; gated behind terminal-backend.
# "pty" + "event" added by A3: posix_openpt/grantpt/unlockpt/ptsname for
# the PTY integration tests, poll(2) for the short-deadline master reads.
rustix = { version = "1", features = ["termios", "system", "fs", "pty", "event"], optional = true }

[dev-dependencies]
# the executor-side parity test: the edit-buffer action ids the keymap
# commands emit (opentui_keymap::textarea::EDIT_BUFFER_ACTIONS) must be
# exactly the ids TextareaState::execute_action implements
opentui-keymap = { workspace = true }

[features]
# Real miniaudio playback-device output (the native `start` path,
# audio.zig:1596-1683): compiles the vendored miniaudio with the same
# backends upstream's miniaudio_shim.c enables, and `audio_start` on
# HeadlessAudioLib opens a real device — err_device (−5) when none
# exists, no silent fallback to the null sink. Default builds keep the
# null sink exactly as before (decoders only, MA_NO_DEVICE_IO).
device-audio = []
# Phase A1 (PLAN-opentui-render-migration): the real-TTY backend —
# termios raw/restore, DECSET mode sequences, alt-screen lifecycle,
# RAII teardown + panic hook. Default builds stay headless-pure (the
# differential harness must not gain system deps).
terminal-backend = ["dep:rustix"]
