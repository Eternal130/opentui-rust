[package]
name = "opentui-core"
description = "API-level Rust port of @opentui/core 0.5.14 (renderables, raster semantics, layout, colors, renderer)"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
taffy = { workspace = true }
unicode-width = { workspace = true }
unicode-segmentation = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }

[dev-dependencies]
# the executor-side parity test: the edit-buffer action ids the keymap
# commands emit (opentui_keymap::textarea::EDIT_BUFFER_ACTIONS) must be
# exactly the ids TextareaState::execute_action implements
opentui-keymap = { workspace = true }
